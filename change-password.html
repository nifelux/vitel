<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vitel — Change Password</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#F1F5F9;min-height:100vh}
    .topbar{display:flex;align-items:center;gap:12px;padding:16px 20px;background:#fff;border-bottom:1px solid #E2E8F0;position:sticky;top:0;z-index:50}
    .back-btn{width:36px;height:36px;border-radius:50%;background:#F1F5F9;border:none;font-size:20px;color:#0F172A;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
    .topbar-title{font-size:17px;font-weight:700;color:#0F172A}

    .content{padding:16px;max-width:480px;margin:0 auto}
    .card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:20px;margin-bottom:14px}

    .lock-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#7C3AED,#0EA5E9);display:flex;align-items:center;justify-content:center;font-size:28px;margin:20px auto 16px}
    .card-title{font-size:18px;font-weight:800;color:#0F172A;text-align:center;margin-bottom:4px}
    .card-sub  {font-size:13px;color:#64748B;text-align:center;margin-bottom:22px}

    .field{margin-bottom:14px}
    .field label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:5px}
    .pw-wrap{position:relative}
    .pw-wrap input{width:100%;padding:13px 48px 13px 16px;border:2px solid #E2E8F0;border-radius:10px;font-size:15px;color:#0F172A;background:#fff;outline:none;font-family:inherit;transition:border-color .2s}
    .pw-wrap input:focus{border-color:#7C3AED}
    .pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:#94A3B8}

    .strength-bar{height:4px;background:#E2E8F0;border-radius:4px;margin-top:6px;overflow:hidden}
    .strength-fill{height:100%;border-radius:4px;transition:width .3s,background .3s}
    .strength-label{font-size:11px;margin-top:4px;font-weight:600}

    .btn{width:100%;padding:15px;border:none;border-radius:50px;background:linear-gradient(135deg,#7C3AED,#0EA5E9);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;margin-top:4px}
    .btn:disabled{opacity:.4;cursor:not-allowed}

    .alert-box{padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:14px}
    .a-error  {background:#FEE2E2;color:#991B1B}
    .a-success{background:#D1FAE5;color:#065F46}

    .tips{background:linear-gradient(135deg,rgba(124,58,237,.06),rgba(14,165,233,.06));border-radius:12px;padding:14px;border:1.5px solid rgba(124,58,237,.12)}
    .tips-title{font-size:12px;font-weight:700;color:#7C3AED;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
    .tips ul{list-style:none;display:flex;flex-direction:column;gap:5px}
    .tips ul li{font-size:12px;color:#475569;padding-left:14px;position:relative}
    .tips ul li::before{content:'✓';position:absolute;left:0;color:#7C3AED;font-weight:700}
  </style>
</head>
<body>
<div style="max-width:480px;margin:0 auto;min-height:100vh;background:#F1F5F9;padding-bottom:30px">
  <div class="topbar">
    <a class="back-btn" href="profile.html">‹</a>
    <span class="topbar-title">🔐 Change Password</span>
  </div>

  <div class="content" style="margin-top:8px">
    <div class="card">
      <div class="lock-icon">🔐</div>
      <div class="card-title">Update Password</div>
      <div class="card-sub">Choose a strong password to keep your account secure</div>

      <div id="alertBox" style="display:none"></div>

      <div class="field">
        <label>Current Password</label>
        <div class="pw-wrap">
          <input type="password" id="currentPw" placeholder="Enter current password"/>
          <button class="pw-toggle" onclick="togglePw('currentPw',this)">👁️</button>
        </div>
      </div>

      <div class="field">
        <label>New Password</label>
        <div class="pw-wrap">
          <input type="password" id="newPw" placeholder="Min. 8 characters" oninput="checkStrength(this.value)"/>
          <button class="pw-toggle" onclick="togglePw('newPw',this)">👁️</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width:0%"></div></div>
        <div class="strength-label" id="strengthLabel" style="color:#94A3B8"></div>
      </div>

      <div class="field">
        <label>Confirm New Password</label>
        <div class="pw-wrap">
          <input type="password" id="confirmPw" placeholder="Re-enter new password"/>
          <button class="pw-toggle" onclick="togglePw('confirmPw',this)">👁️</button>
        </div>
      </div>

      <button class="btn" id="saveBtn" onclick="changePassword()">Update Password</button>
    </div>

    <div class="tips">
      <div class="tips-title">Password Tips</div>
      <ul>
        <li>Use at least 8 characters</li>
        <li>Mix uppercase and lowercase letters</li>
        <li>Include numbers and symbols (!@#$)</li>
        <li>Don't reuse passwords from other sites</li>
      </ul>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>
<script>
(function(){
  function waitSb(cb){if(window.sb&&window.VitelAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.VitelAuth){clearInterval(t);cb();}},50);}
  waitSb(async function(){ await window.VitelAuth.requireAuth(); });

  window.togglePw=function(id,btn){
    var inp=document.getElementById(id);
    if(inp.type==="password"){ inp.type="text"; btn.textContent="🙈"; }
    else { inp.type="password"; btn.textContent="👁️"; }
  };

  window.checkStrength=function(pw){
    var fill=document.getElementById("strengthFill");
    var label=document.getElementById("strengthLabel");
    if(!pw){ fill.style.width="0%"; label.textContent=""; return; }
    var score=0;
    if(pw.length>=8) score++;
    if(pw.length>=12) score++;
    if(/[A-Z]/.test(pw)&&/[a-z]/.test(pw)) score++;
    if(/[0-9]/.test(pw)) score++;
    if(/[^A-Za-z0-9]/.test(pw)) score++;
    var levels=[
      {pct:"20%",color:"#EF4444",text:"Very weak"},
      {pct:"40%",color:"#F97316",text:"Weak"},
      {pct:"60%",color:"#F59E0B",text:"Fair"},
      {pct:"80%",color:"#10B981",text:"Strong"},
      {pct:"100%",color:"#059669",text:"Very strong"},
    ];
    var l=levels[Math.min(score,4)];
    fill.style.width=l.pct; fill.style.background=l.color;
    label.textContent=l.text; label.style.color=l.color;
  };

  window.changePassword=async function(){
    var current=document.getElementById("currentPw").value;
    var newPw=document.getElementById("newPw").value;
    var confirm=document.getElementById("confirmPw").value;
    var al=document.getElementById("alertBox");
    var btn=document.getElementById("saveBtn");
    al.style.display="none";

    if(!current||!newPw||!confirm){
      al.textContent="Please fill in all fields."; al.className="alert-box a-error"; al.style.display="block"; return;
    }
    if(newPw.length<8){
      al.textContent="New password must be at least 8 characters."; al.className="alert-box a-error"; al.style.display="block"; return;
    }
    if(newPw!==confirm){
      al.textContent="New passwords do not match."; al.className="alert-box a-error"; al.style.display="block"; return;
    }
    if(current===newPw){
      al.textContent="New password must be different from current password."; al.className="alert-box a-error"; al.style.display="block"; return;
    }

    btn.disabled=true; btn.textContent="Updating…";

    try {
      // Re-authenticate first
      var {data:s}=await window.sb.auth.getSession();
      var email=s?.session?.user?.email;
      if(!email){ al.textContent="Session expired. Please log in again."; al.className="alert-box a-error"; al.style.display="block"; btn.disabled=false; btn.textContent="Update Password"; return; }

      var {error:loginErr}=await window.sb.auth.signInWithPassword({email,password:current});
      if(loginErr){
        al.textContent="Current password is incorrect."; al.className="alert-box a-error"; al.style.display="block";
        btn.disabled=false; btn.textContent="Update Password"; return;
      }

      // Update password
      var {error:updateErr}=await window.sb.auth.updateUser({password:newPw});
      if(updateErr){
        al.textContent=updateErr.message||"Failed to update password. Try again."; al.className="alert-box a-error"; al.style.display="block";
        btn.disabled=false; btn.textContent="Update Password"; return;
      }

      al.textContent="✅ Password updated successfully!"; al.className="alert-box a-success"; al.style.display="block";
      document.getElementById("currentPw").value="";
      document.getElementById("newPw").value="";
      document.getElementById("confirmPw").value="";
      document.getElementById("strengthFill").style.width="0%";
      document.getElementById("strengthLabel").textContent="";
      btn.disabled=false; btn.textContent="Update Password";

    } catch(e){
      al.textContent="Something went wrong. Try again."; al.className="alert-box a-error"; al.style.display="block";
      btn.disabled=false; btn.textContent="Update Password";
    }
  };
})();
</script>
</body>
      </html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vitel — Withdraw</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <style>
    .bal-card { background:linear-gradient(135deg,var(--purple),var(--sky)); border-radius:20px; margin:16px; padding:22px; color:#fff; text-align:center; }
    .bal-label { font-size:12px; opacity:.8; text-transform:uppercase; letter-spacing:.08em; }
    .bal-amount { font-size:38px; font-weight:800; margin:6px 0; }
    .min-note { font-size:12px; opacity:.75; }
    .saved-card { background:var(--card); border-radius:var(--radius-sm); padding:12px 14px; border:2px solid var(--border); display:flex; align-items:center; gap:12px; cursor:pointer; margin-bottom:8px; transition:border-color .15s; }
    .saved-card.selected { border-color:var(--purple); background:var(--purple-light); }
    .saved-card-icon { width:36px; height:36px; border-radius:8px; background:var(--sky-light); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
    .saved-card-name { font-size:13px; font-weight:700; color:var(--text); }
    .saved-card-num  { font-size:11px; color:var(--muted); margin-top:1px; }
  </style>
</head>
<body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">
<div class="page-wrap">
  <div class="topbar">
    <a class="back-btn" href="dashboard.html">‹</a>
    <span class="topbar-title">💸 Withdraw</span>
    <div></div>
  </div>

  <div class="bal-card">
    <div class="bal-label">Available Balance</div>
    <div class="bal-amount" id="balance">₦0.00</div>
    <div class="min-note">Minimum withdrawal: ₦1,000</div>
  </div>

  <div class="section">
    <div id="alert" class="alert"></div>

    <!-- Amount -->
    <div class="field">
      <label class="field-label">Amount (₦)</label>
      <input class="field-input" type="number" id="amount" placeholder="Enter amount to withdraw" min="1000"/>
    </div>

    <!-- Saved bank cards -->
    <div class="field">
      <label class="field-label">Select Bank Account</label>
      <div id="savedCards"></div>
      <button onclick="toggleManual()" style="font-size:13px;color:var(--purple);font-weight:600;background:none;border:none;cursor:pointer;padding:4px 0;margin-top:4px">+ Enter manually</button>
    </div>

    <!-- Manual bank entry -->
    <div id="manualFields" style="display:none">
      <div class="field">
        <label class="field-label">Bank Name</label>
        <input class="field-input" id="bankName" placeholder="e.g. OPay, GTBank, Access"/>
      </div>
      <div class="field">
        <label class="field-label">Account Number</label>
        <input class="field-input" id="acctNum" placeholder="0000000000" type="tel" maxlength="10"/>
      </div>
      <div class="field">
        <label class="field-label">Account Name</label>
        <input class="field-input" id="acctName" placeholder="Full account name"/>
      </div>
    </div>

    <button class="btn btn-primary" id="withdrawBtn" onclick="doWithdraw()">Request Withdrawal</button>
  </div>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/js/supabase.js" defer></script>
<script src="assets/js/auth.js" defer></script>
<script>
(function(){
  var uid="", balance=0, selectedCard=null, showManual=false;
  function waitSb(cb){if(window.sb&&window.VitelAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.VitelAuth){clearInterval(t);cb();}},50);}

  waitSb(async function(){
    var s=await window.VitelAuth.requireAuth(); if(!s)return;
    uid=s.user.id;

    var {data:w}=await window.sb.from("wallets").select("balance").eq("user_id",uid).single();
    balance=w?.balance||0;
    document.getElementById("balance").textContent=window.VitelAuth.money(balance);

    // Load saved bank cards
    var r=await fetch("/api/user?action=bank-cards&user_id="+uid);
    var d=await r.json();
    var cards=d.cards||[];
    var wrap=document.getElementById("savedCards");
    if(!cards.length){
      wrap.innerHTML='<div style="font-size:13px;color:var(--muted)">No saved accounts.</div>';
      toggleManual();
    } else {
      wrap.innerHTML=cards.map(function(c){
        return '<div class="saved-card" id="sc-'+c.id+'" onclick="selectCard(\''+c.id+'\',\''+c.bank_name+'\',\''+c.account_number+'\',\''+c.account_name+'\')">'+
          '<div class="saved-card-icon">💳</div>'+
          '<div>'+
            '<div class="saved-card-name">'+c.bank_name+'</div>'+
            '<div class="saved-card-num">'+c.account_number+' · '+c.account_name+'</div>'+
          '</div>'+
          (c.is_default?'<span class="pill pill-purple" style="margin-left:auto;font-size:10px">Default</span>':'')+
        '</div>';
      }).join("");
      // Auto-select default
      var def=cards.find(function(c){return c.is_default;})||cards[0];
      if(def) selectCard(def.id,def.bank_name,def.account_number,def.account_name);
    }
  });

  window.selectCard=function(id,bank,num,name){
    document.querySelectorAll(".saved-card").forEach(function(c){c.classList.remove("selected");});
    var el=document.getElementById("sc-"+id); if(el) el.classList.add("selected");
    selectedCard={bank_name:bank,account_number:num,account_name:name};
    showManual=false;
    document.getElementById("manualFields").style.display="none";
  };

  window.toggleManual=function(){
    showManual=!showManual;
    document.getElementById("manualFields").style.display=showManual?"block":"none";
    if(showManual) selectedCard=null;
  };

  window.doWithdraw=async function(){
    var btn=document.getElementById("withdrawBtn");
    var al=document.getElementById("alert");
    var amt=Number(document.getElementById("amount").value);
    al.className="alert";

    if(!amt||amt<1000){ al.textContent="Minimum withdrawal is ₦1,000"; al.className="alert alert-error show"; return; }
    if(amt>balance){ al.textContent="Insufficient balance"; al.className="alert alert-error show"; return; }

    var bank=selectedCard?.bank_name||document.getElementById("bankName")?.value?.trim();
    var num =selectedCard?.account_number||document.getElementById("acctNum")?.value?.trim();
    var name=selectedCard?.account_name||document.getElementById("acctName")?.value?.trim();

    if(!bank||!num||!name){ al.textContent="Please provide bank account details"; al.className="alert alert-error show"; return; }

    btn.disabled=true; btn.textContent="Processing…";
    var r=await fetch("/api/withdraw",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid,amount:amt,bank_name:bank,account_number:num,account_name:name})});
    var d=await r.json();
    if(d.ok){
      al.textContent="✅ Withdrawal request submitted! We'll process it within 24 hours.";
      al.className="alert alert-success show";
      btn.textContent="Submitted ✓";
      balance-=amt;
      document.getElementById("balance").textContent=window.VitelAuth.money(balance);
    } else {
      al.textContent=d.error||"Error processing request";
      al.className="alert alert-error show";
      btn.disabled=false; btn.textContent="Request Withdrawal";
    }
  };
})();
</script>
</body>
  </html>
